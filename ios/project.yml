name: DuoRemote
options:
  bundleIdPrefix: com.duoremote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DuoRemote:
    type: application
    platform: iOS
    sources:
      - DuoRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duoremote.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: DuoRemote/Info.plist
      properties:
        CFBundleDisplayName: DuoRemote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 同じネットワークにあるPCに接続するために使います
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
